[project]
name = "llmprover-right-size"
version = "0.1.0"
description = "Run one prompt across several models, mark which answers are good enough, and see the cheapest of the ones you accepted -- the cheapest model that still clears your bar. You judge quality, the tool does cost arithmetic. Free, own-key, provider-direct."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pysolvr" }]
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.urls]
Homepage = "https://llmprover.pysolvr.com"
"Scoring guide" = "https://llmprover.pysolvr.com/guides/scoring-guide/"
Source = "https://github.com/dAIvdMercer/llmprover-tools/tree/main/tools/right-size"

[project.scripts]
llmprover-right-size = "right_size:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["right_size", "right_size_core"]

[tool.setuptools.package-data]
"*" = ["prices.json"]
