[project]
name = "llmprover-compare"
version = "0.1.0"
description = "Compare two LLMs head-to-head on your own prompt, with your own keys. Free, own-key, provider-direct."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pysolvr" }]
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.urls]
Homepage = "https://llmprover.com"
Pricing = "https://llmprover.com/api-pricing/"
Source = "https://github.com/dAIvdMercer/llmprover-tools/tree/main/tools/compare"

[project.scripts]
llmprover-compare = "compare:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["compare", "compare_core"]

[tool.setuptools.package-data]
"*" = ["prices.json"]
