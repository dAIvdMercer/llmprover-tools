[project]
name = "llmprover-gold-check"
version = "0.1.0"
description = "Check a model's answer against a known-correct reference (your gold standard) with a single-pass judge. A basic first-look check, not professional verification. Free, own-key, provider-direct."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pysolvr" }]
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.urls]
Homepage = "https://llmprover.pysolvr.com"
"Scoring guide" = "https://llmprover.pysolvr.com/guides/scoring-guide/"
Source = "https://github.com/dAIvdMercer/llmprover-tools/tree/main/tools/gold-check"

[project.scripts]
llmprover-gold-check = "gold_check:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["gold_check", "gold_check_core"]

[tool.setuptools.package-data]
"*" = ["prices.json"]
