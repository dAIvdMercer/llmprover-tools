[project]
name = "llmprover-context-ab"
version = "0.1.0"
description = "See how the context you supply changes an AI's answer -- with vs without, or A vs B. Free, own-key, provider-direct."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pysolvr" }]
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.urls]
Homepage = "https://llmprover.com"
"RAG evaluation" = "https://llmprover.com/rag-evaluation/"
Source = "https://github.com/dAIvdMercer/llmprover-tools/tree/main/tools/context-ab"

[project.scripts]
llmprover-context-ab = "context_ab:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["context_ab", "context_ab_core"]

[tool.setuptools.package-data]
"*" = ["prices.json"]
