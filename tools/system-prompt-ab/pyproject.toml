[project]
name = "llmprover-system-prompt-ab"
version = "0.1.0"
description = "Hold one question fixed and run it at one model under two system prompts -- a vague one next to a tight one -- to see each answer's token cost and latency side by side. Mechanical, no verdict. Free, own-key, provider-direct."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pysolvr" }]
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.urls]
Homepage = "https://llmprover.pysolvr.com"
"Scoring guide" = "https://llmprover.pysolvr.com/guides/scoring-guide/"
Source = "https://github.com/dAIvdMercer/llmprover-tools/tree/main/tools/system-prompt-ab"

[project.scripts]
llmprover-system-prompt-ab = "system_prompt_ab:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["system_prompt_ab", "system_prompt_ab_core"]

[tool.setuptools.package-data]
"*" = ["prices.json"]
