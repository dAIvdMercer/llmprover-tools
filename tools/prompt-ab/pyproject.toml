[project]
name = "llmprover-prompt-ab"
version = "0.1.0"
description = "Fire two or more prompts at one model and see each response, token cost, and latency side by side -- a rambling ask next to a tight one. Mechanical, no verdict. Free, own-key, provider-direct."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pysolvr" }]
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.urls]
Homepage = "https://llmprover.pysolvr.com"
"Scoring guide" = "https://llmprover.pysolvr.com/guides/scoring-guide/"
Source = "https://github.com/dAIvdMercer/llmprover-tools/tree/main/tools/prompt-ab"

[project.scripts]
llmprover-prompt-ab = "prompt_ab:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["prompt_ab", "prompt_ab_core"]

[tool.setuptools.package-data]
"*" = ["prices.json"]
