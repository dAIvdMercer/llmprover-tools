[project]
name = "llmprover-faithfulness"
version = "0.1.0"
description = "Paste a source, ask a question, and get a single-pass read of how faithful the AI answer is to that source: what it added, what it contradicts. A review aid, not a compliance verdict. Free, own-key, provider-direct."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pysolvr" }]
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.urls]
Homepage = "https://llmprover.pysolvr.com"
"Scoring guide" = "https://llmprover.pysolvr.com/guides/scoring-guide/"
Source = "https://github.com/dAIvdMercer/llmprover-tools/tree/main/tools/faithfulness"

[project.scripts]
llmprover-faithfulness = "faithfulness:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["faithfulness", "faithfulness_core"]

[tool.setuptools.package-data]
"*" = ["prices.json"]
