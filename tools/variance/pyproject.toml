[project]
name = "llmprover-variance"
version = "0.1.0"
description = "Run the same prompt at one model N times and see how much the answer moves -- a mechanical consistency read, no quality verdict. Free, own-key, provider-direct."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pysolvr" }]
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.urls]
Homepage = "https://llmprover.pysolvr.com"
"Scoring guide" = "https://llmprover.pysolvr.com/guides/scoring-guide/"
Source = "https://github.com/dAIvdMercer/llmprover-tools/tree/main/tools/variance"

[project.scripts]
llmprover-variance = "variance:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["variance", "variance_core"]

[tool.setuptools.package-data]
"*" = ["prices.json"]
